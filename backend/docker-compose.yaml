version: '3.8'

services:
  # MongoDB 데이터베이스 서비스
  mongodb:
    image: mongo:7.0  # MongoDB 7.0 버전 사용
    container_name: mongodb  # 컨테이너 이름 지정
    restart: always  # 컨테이너가 중지되면 자동으로 재시작
    
    # 포트 매핑 (호스트:컨테이너)
    ports:
      - "27017:27017"  # MongoDB 기본 포트
    
    # 환경 변수 설정
    environment:
      # MongoDB 관리자 계정 설정
      MONGO_INITDB_ROOT_USERNAME: admin  # 루트 사용자명
      MONGO_INITDB_ROOT_PASSWORD: admin123  # 루트 비밀번호 (실제 운영시 변경 필요!)
      MONGO_INITDB_DATABASE: dongguk_db  # 초기 생성할 데이터베이스 이름
    
    # 볼륨 마운트 제거 - 데이터는 컨테이너 내부에만 저장 (컨테이너 삭제시 데이터도 삭제됨)
    # volumes:
    #   - ./data/mongodb:/data/db
    #   - ./data/mongodb_config:/data/configdb
    
    # 컨테이너 헬스체크 설정
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s  # 10초마다 체크
      timeout: 5s  # 5초 안에 응답 없으면 실패
      retries: 3  # 3번 실패하면 unhealthy 상태로 표시
      start_period: 30s  # 컨테이너 시작 후 30초 대기
    
    # 네트워크 설정
    networks:
      - app-network

  # MongoDB 관리 툴 (선택사항 - 웹 UI로 MongoDB 관리)
  mongo-express:
    image: mongo-express:latest  # Mongo Express 최신 버전
    container_name: mongo-express  # 컨테이너 이름
    restart: always
    
    # 포트 매핑
    ports:
      - "8081:8081"  # 웹 UI 접속 포트
    
    # 환경 변수 설정
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin  # MongoDB 관리자 계정
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123  # MongoDB 관리자 비밀번호
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/  # MongoDB 연결 URL
      ME_CONFIG_BASICAUTH_USERNAME: admin  # Mongo Express 로그인 계정
      ME_CONFIG_BASICAUTH_PASSWORD: admin123  # Mongo Express 로그인 비밀번호
    
    # MongoDB 서비스가 실행된 후에 시작
    depends_on:
      - mongodb
    
    # 네트워크 설정
    networks:
      - app-network

  # MySQL 데이터베이스 서비스
  mysql:
    image: mysql:8.0  # MySQL 8.0 버전 사용
    container_name: mysql_container  # 컨테이너 이름 지정
    restart: always  # 컨테이너 중지 시 자동 재시작

    # 포트 매핑 (호스트:컨테이너)
    ports:
      - "3307:3306"  # MySQL 기본 포트

    # 환경 변수 설정
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword  # 루트 계정 비밀번호 (운영 시 변경 필요)
      MYSQL_DATABASE: YOUR_MYSQL_DATABASE  # 초기 생성할 데이터베이스 이름
      MYSQL_USER: YOUR_MYSQL_USER  # 일반 사용자 계정명
      MYSQL_PASSWORD: YOUR_MYSQL_PASSWORD  # 일반 사용자 비밀번호

    # 볼륨 마운트
    # volumes:
    #   - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pYOUR_MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

    # 네트워크 설정
    networks:
      app-network:
        aliases:
          - localhost

  # DB 초기화용 Python 스크립트 컨테이너
  db_init:
    image: python:3.11  # Python 3.11 이미지 사용
    container_name: db_initializer  # 컨테이너 이름
    depends_on:
      - mysql  # MySQL 실행 완료 후 실행
    volumes:
      - .:/app  # 현재 backend 디렉토리를 컨테이너 내부 /app에 마운트
    working_dir: /app  # 작업 디렉토리 지정
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python src/db_init.py"

    # 환경 변수 설정 (MySQL 컨테이너와 동일하게 맞춤)
    environment:
      MYSQL_HOST: mysql  # MySQL 컨테이너 이름 (호스트 지정)
      MYSQL_PORT: 3306
      MYSQL_DATABASE: YOUR_MYSQL_DATABASE
      MYSQL_USER: YOUR_MYSQL_USER
      MYSQL_PASSWORD: YOUR_MYSQL_PASSWORD

    # 네트워크 설정
    networks:
      - app-network

# 볼륨 정의 (호스트 경로 직접 마운트 사용으로 불필요)
# volumes:
#   mongodb_data:  # MongoDB 데이터를 저장할 볼륨
#     driver: local
#   mongodb_config:  # MongoDB 설정을 저장할 볼륨
#     driver: local

# 네트워크 정의
networks:
  app-network:  # 애플리케이션 네트워크
    driver: bridge
